name: docs

on:
  push:
    branches: [main, "release/**"]
  pull_request:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PUBLIC_CF_BEACON_TOKEN: ${{ secrets.CLOUDFLARE_BEACON_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - uses: taiki-e/install-action@v2
        with:
          tool: just

      # Compiles every snippet; the docs build fails when a sample no longer compiles or is stale.
      - name: Snippets compile and are current
        run: |
          dotnet build site/snippets/Deedbox.Snippets -c Release
          bash checks/docs-snippets-current.sh

      - name: Vale
        run: just vale

      - name: Build the site
        run: |
          cd site
          npm ci --no-audit --no-fund
          npx astro build

      # Each branch deploys to its own alias: main is latest, release/0.1 becomes release-0-1, a pull request gets a preview.
      - name: Deploy to Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != ''
        id: deploy
        run: |
          branch="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          url=$(npx --yes wrangler@4 pages deploy site/dist --project-name=deedbox-docs --branch="$branch" | grep -oE 'https://[^ ]+\.pages\.dev' | tail -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Comment the preview URL
        if: github.event_name == 'pull_request' && steps.deploy.outputs.url != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment ${{ github.event.number }} --body "Docs preview: ${{ steps.deploy.outputs.url }}" --edit-last || gh pr comment ${{ github.event.number }} --body "Docs preview: ${{ steps.deploy.outputs.url }}"

      - name: Deploy skipped
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::notice::CLOUDFLARE_API_TOKEN is not set, so the site was built but not deployed."
